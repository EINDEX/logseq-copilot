# Two uploads per commit, merged into one project total:
# - `unit`: vitest (build.yml, `pnpm test:coverage`);
# - `e2e`: the instrumented E2E build in Chromium and Firefox
#   (integration.yml, tests/e2e/coverage.ts).
coverage:
  status:
    project:
      default:
        target: auto
        # A drop of up to 1% does not fail the check.
        threshold: 1%
    patch:
      default:
        target: 80%

# A run that uploads only one flag keeps the other flag's last coverage.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
    - name: e2e

# Files with nothing to cover. Keep in sync with `coverage.exclude` in
# vitest.config.ts.
ignore:
  - 'src/**/*.test.ts'
  - 'src/**/*.test.tsx'
  # shadcn/ui components, generated by its CLI.
  - 'src/components/ui/**'
  # Types only.
  - 'src/types/highlight.ts'
  - 'src/types/logseqBlock.ts'
  - 'src/types/recall.ts'
  - 'src/entrypoints/background/logseq/interfaces.ts'
  # Re-exports only.
  - 'src/config.ts'
  - 'src/utils/index.ts'
  # Entrypoint bootstraps: mount the React app into the page.
  - 'src/entrypoints/options/index.tsx'
  - 'src/entrypoints/sidepanel/main.tsx'
