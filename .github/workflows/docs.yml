name: Website Deploy

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/**'
  release:
    types: [published]
  # Called by release-please.yml once a release is created: releases made with
  # GITHUB_TOKEN do not fire the `release` event above.
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: true
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm build

      # Production deploys happen on a release (called from release-please.yml,
      # or the `release` event) or by hand from the Actions tab. A push only
      # builds the docs.
      - name: Publish to Cloudflare Pages
        if: inputs.deploy || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 162c9bc5d98e73ac9c64f756da29d06d
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Run Wrangler inside docs/ with pnpm. The action installs Wrangler in its
          # working directory and picks npm when it finds a package-lock.json,
          # which docs/ has next to its pnpm-lock.yaml.
          workingDirectory: docs
          packageManager: pnpm
          # dist is docs/dist, the Astro build output
          command: pages deploy dist --project-name=logseq-copilot-page --branch=main
