name: Website Deploy

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/**'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm build

      # Production deploys come from main only: pushes to main and published
      # releases. A push to any other branch or tag stops after the docs build.
      - name: Publish to Cloudflare Pages
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 162c9bc5d98e73ac9c64f756da29d06d
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Run Wrangler inside docs/ with pnpm. The action installs Wrangler in its
          # working directory and picks npm when it finds a package-lock.json,
          # which docs/ has next to its pnpm-lock.yaml.
          workingDirectory: docs
          packageManager: pnpm
          # dist is docs/dist, the Astro build output
          command: pages deploy dist --project-name=logseq-copilot-page --branch=main
