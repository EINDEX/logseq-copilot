name: Website Deploy

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/**'
  release:
    types: [published]
  # Called by release-please.yml once a release is created: releases made with
  # GITHUB_TOKEN do not fire the `release` event above.
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: true
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Only docs/: the site is its own project. With the whole repository,
      # Astro falls back to loading its config through Vite (starlight-blog
      # ships TypeScript), and Vite then reads the root tsconfig.json, which
      # extends .wxt/tsconfig.json, a file only `wxt prepare` creates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm build

      # A push to a branch other than main publishes a preview of that branch,
      # at https://<branch>.logseq-copilot-page.pages.dev (Cloudflare marks
      # previews noindex). The alias keeps letters, digits and dashes only, as
      # Cloudflare does.
      - name: Name the preview
        id: alias
        if: github.event_name == 'push' && github.ref_name != 'main'
        env:
          REF: ${{ github.ref_name }}
        run: |
          ALIAS=$(printf '%s' "$REF" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-')
          echo "value=$ALIAS" >> "$GITHUB_OUTPUT"

      - name: Publish a preview to Cloudflare Pages
        id: preview
        if: steps.alias.outputs.value
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 162c9bc5d98e73ac9c64f756da29d06d
          # Exact version: the action installs Wrangler at run time and hands
          # it the token, so a floating `wrangler@4` would run whatever npm
          # serves that day with the token.
          wranglerVersion: '4.160.1'
          workingDirectory: docs
          packageManager: pnpm
          command: pages deploy dist --project-name=logseq-copilot-page --branch=${{ steps.alias.outputs.value }}

      - name: Show the preview address
        if: steps.preview.outcome == 'success'
        env:
          ALIAS_URL: ${{ steps.preview.outputs.pages-deployment-alias-url }}
          URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          {
            echo "### Docs preview"
            echo "- Branch: ${ALIAS_URL:-https://${{ steps.alias.outputs.value }}.logseq-copilot-page.pages.dev}"
            echo "- This deployment: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Production deploys happen on a release (called from release-please.yml,
      # or the `release` event) or by hand from the Actions tab.
      - name: Publish to Cloudflare Pages
        if: inputs.deploy || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 162c9bc5d98e73ac9c64f756da29d06d
          # Exact version: the action installs Wrangler at run time and hands
          # it the token, so a floating `wrangler@4` would run whatever npm
          # serves that day with the token.
          wranglerVersion: '4.160.1'
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Run Wrangler inside docs/ with pnpm. The action installs Wrangler in its
          # working directory and picks npm when it finds a package-lock.json,
          # which docs/ has next to its pnpm-lock.yaml.
          workingDirectory: docs
          packageManager: pnpm
          # dist is docs/dist, the Astro build output
          command: pages deploy dist --project-name=logseq-copilot-page --branch=main
