name: Publish

# Normally called by release-please.yml once a release is created. It can also
# be run by hand: push a `v*` tag, or start it from the Actions tab with the
# tag to publish (the tag must already exist).
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v2.0.0'
        required: true
        type: string
      platforms:
        description: 'Comma-separated subset of chrome,edge,firefox,github; empty means all'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v2.0.0'
        required: true
        type: string
      # To retry some stores only, e.g. `chrome,edge`: a store that already has
      # this version (AMO after a successful upload) fails the whole run.
      platforms:
        description: 'Comma-separated subset of chrome,edge,firefox,github; empty means all'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.platforms.outputs.value }}
    steps:
      - name: Pick platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          value=$(jq -cn --arg p "${PLATFORMS:-chrome,edge,firefox,github}" \
            '$p | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != "")) | unique')
          if ! jq -e 'length > 0 and all(.[]; IN("chrome", "edge", "firefox", "github"))' <<<"$value" >/dev/null; then
            echo "::error::platforms must be a comma-separated subset of chrome,edge,firefox,github, got '$PLATFORMS'"
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  publish:
    needs: platforms
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.value) }}
      fail-fast: false
    runs-on: ubuntu-latest
    environment: 'publish'
    steps:
      # Only ever build and publish an existing vX.Y.Z tag: the dispatch input is
      # free text, and this job holds the store secrets. The first checkout is
      # just the workflow's own ref, so git can ask the remote about the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$TAG"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.value }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Use Node.js
        with:
          node-version: 26.x
          cache: 'pnpm'

      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Testing
        run: pnpm test

      # The extension version comes from package.json (WXT names zips after it).
      - name: Read extension version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          pnpm zip
          pnpm zip:firefox

      # AMO needs the human readable sources for bundled code; `pnpm zip:firefox`
      # writes them next to the extension zip.
      - name: Firefox Upload & release
        run: pnpm publish:firefox --upload-source-code ".output/logseq-copilot-${{ steps.version.outputs.value }}-sources.zip"
        if: matrix.platform == 'firefox'
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_WEB_EXT_API_SECRET }}

      - name: Chrome Upload & release
        if: matrix.platform == 'chrome'
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: .output/logseq-copilot-${{ steps.version.outputs.value }}-chrome.zip
          extension-id: 'hihgfcgbmnbomabfdbajlbpnacndeihl'
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      # Edge Add-ons rejects a manifest with `key` ("The manifest shouldn't
      # contain the key field"). Tags from 2.0.1 on have `zip:edge`, which
      # builds without it. Older tags (v2.0.0) don't: their publish script
      # uploads the Chrome zip, so take `key` out of that zip here. It is
      # this job's copy; the Chrome job and the GitHub release build their own.
      - name: Package Edge
        if: matrix.platform == 'edge'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          pnpm run --if-present zip:edge
          zip=".output/logseq-copilot-$VERSION-edge.zip"
          [[ -f "$zip" ]] || zip=".output/logseq-copilot-$VERSION-chrome.zip"
          if unzip -p "$zip" manifest.json | jq -e 'has("key")' >/dev/null; then
            echo "Removing key from $zip"
            dir=$(mktemp -d)
            unzip -q "$zip" -d "$dir"
            jq 'del(.key)' "$dir/manifest.json" > "$dir/manifest.json.new"
            mv "$dir/manifest.json.new" "$dir/manifest.json"
            out="$PWD/$zip"
            rm "$out"
            (cd "$dir" && zip -qrX "$out" .)
          fi
          unzip -p "$zip" manifest.json | jq -e 'has("key") | not' >/dev/null

      - name: Edge Upload & release
        run: pnpm publish:edge
        if: matrix.platform == 'edge'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: matrix.platform == 'github'
        with:
          # Attaches to the release release-please created; creates it when
          # publishing from a manually pushed tag.
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            .output/logseq-copilot-${{ steps.version.outputs.value }}-chrome.zip
            .output/logseq-copilot-${{ steps.version.outputs.value }}-firefox.zip
