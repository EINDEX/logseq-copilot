name: Publish

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    strategy:
      matrix:
        platform: [chrome, edge, firefox, github]
      fail-fast: false
    runs-on: ubuntu-latest
    environment: 'publish'
    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        name: Use Node.js
        with:
          node-version: 22.x
          cache: 'pnpm'

      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Testing
        run: pnpm test

      # The extension version comes from package.json (WXT names zips after it).
      - name: Read extension version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Firefox Upload & release
        run: pnpm publish:firefox
        if: matrix.platform == 'firefox'
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_WEB_EXT_API_SECRET }}

      - name: Chrome Upload & release
        if: matrix.platform == 'chrome'
        uses: mnao305/chrome-extension-upload@v4.0.1
        with:
          file-path: .output/logseq-copliot-${{ steps.version.outputs.value }}-chrome.zip
          extension-id: 'hihgfcgbmnbomabfdbajlbpnacndeihl'
          client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      - name: Edge Upload & release
        run: pnpm publish:edge
        if: matrix.platform == 'edge'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET }}
          EDGE_ACCESS_TOKEN_URL: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

      - name: Release
        uses: softprops/action-gh-release@v1
        if: matrix.platform == 'github'
        with:
          files: |
            .output/logseq-copliot-${{ steps.version.outputs.value }}-chrome.zip
            .output/logseq-copliot-${{ steps.version.outputs.value }}-firefox.zip
