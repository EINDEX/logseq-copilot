name: Site check

# Opens the live result page of every built-in search engine with the E2E
# build and a real Logseq, and checks that the search card still mounts there
# and lists notes (tests/e2e/live; see "Live site check" in
# tests/e2e/README.md). The job fails when a site is `broken` or `degraded`;
# `blocked` (captcha, consent page) and `skipped` do not fail it.
#
# Scheduled runs check out `wxt`, the development branch, so a broken site is
# found before it is released. GitHub starts `schedule` runs only from the
# workflow file on the default branch (`main`): the daily run starts once this
# file is on main. Manual runs check out the ref picked in "Use workflow from".

on:
  schedule:
    # Daily, off the full hour (the full hour is when scheduled runs queue up).
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Engine ids to check, comma-separated (empty: all), e.g. bing,brave'
        type: string
        default: ''
      open_issue:
        description: 'Open, update or close the "Site check: adapters broken" issue'
        type: boolean
        default: false

permissions: {}

# Two runs at once would query every site twice and race on the issue.
concurrency:
  group: site-check
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.result.outputs.failed }}
      complete: ${{ steps.result.outputs.complete }}
      report: ${{ steps.result.outputs.report }}
      commit: ${{ steps.result.outputs.commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'wxt' || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Use Node.js
        with:
          node-version: 26.x
          cache: 'pnpm'

      - run: pnpm install

      - name: Install Electron runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libsecret-1-0 libnss3 libgbm1 libasound2t64 libgtk-3-0t64

      - name: Install Playwright Chromium
        # The full build (extensions need it, not the headless shell).
        run: pnpm exec playwright install --with-deps --no-shell chromium

      - name: Cache Logseq
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .logseq-bin/file-0.10.15
          key: logseq-file-0.10.15

      - name: Download Logseq
        id: logseq
        run: echo "bin=$(scripts/download-logseq.sh file 0.10.15 .logseq-bin | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Mask the Kagi session token
        # GitHub masks the secret as it is; the sign-in request holds it
        # URL-encoded (tests/e2e/live/sites.ts).
        run: |
          encoded=$(node -e 'process.stdout.write(encodeURIComponent((process.env.KAGI_SESSION_TOKEN ?? "").trim()))')
          if [ -n "$encoded" ]; then
            echo "::add-mask::$encoded"
          fi
        env:
          KAGI_SESSION_TOKEN: ${{ secrets.KAGI_SESSION_TOKEN }}

      - name: Check the sites
        # Builds the E2E extension, then opens every result page in headed
        # Chromium (the sites answer HeadlessChrome with captchas). Playwright's
        # globalTimeout (25 min) stops a stuck run before this.
        run: xvfb-run -a pnpm test:live
        timeout-minutes: 28
        env:
          LOGSEQ_VARIANT: file
          LOGSEQ_BIN: ${{ steps.logseq.outputs.bin }}
          LOGSEQ_DEBUG: ${{ runner.debug }}
          SITE_CHECK_SITES: ${{ inputs.sites }}
          # Optional: without it Kagi is `skipped`.
          KAGI_SESSION_TOKEN: ${{ secrets.KAGI_SESSION_TOKEN }}

      - name: Report
        id: result
        if: always()
        run: |
          dir=test-results/site-check
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ ! -f "$dir/results.json" ]; then
            echo '### Site check: no results, the check did not run (see the log)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$dir/results.md" >> "$GITHUB_STEP_SUMMARY"
          # The notes quote the sites (titles, URLs): a random delimiter.
          # GitHub drops an output that holds a secret or masked value; the
          # Kagi token is in no checked URL and redact() (sites.ts) takes it
          # out of the notes.
          eof="SITE_CHECK_$(openssl rand -hex 16)"
          {
            echo "failed=$(jq -r .failed "$dir/results.json")"
            echo "complete=$(jq -r .complete "$dir/results.json")"
            echo "report<<$eof"
            cat "$dir/results.md"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

      - name: Upload results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-check
          # Not test-results/site-check-runs: the traces of failed attempts
          # hold the pages' requests, and could hold the Kagi sign-in request.
          path: test-results/site-check
          if-no-files-found: ignore

  issue:
    # One open issue at a time: opened or updated while a site is broken or
    # degraded, closed by the first run that checks every site and finds none.
    name: issue
    needs: check
    if: always() && (github.event_name == 'schedule' || inputs.open_issue) && needs.check.outputs.report != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: 'Site check: adapters broken'
      LABEL: site-check
      FAILED: ${{ needs.check.outputs.failed }}
      COMPLETE: ${{ needs.check.outputs.complete }}
      REPORT: ${{ needs.check.outputs.report }}
      COMMIT: ${{ needs.check.outputs.commit }}
      REF: ${{ github.event_name == 'schedule' && 'wxt' || github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Open, update or close the issue
        run: |
          number=$(gh issue list --state open --label "$LABEL" --limit 100 --json number,title \
            | jq -r --arg title "$TITLE" 'map(select(.title == $title)) | .[0].number // empty')
          if [ "$FAILED" = true ]; then
            {
              printf '%s\n\n' "$REPORT"
              echo "Run: $RUN_URL (\`$REF\` at $COMMIT)"
            } > body.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
              echo "Updated #$number"
            else
              gh label create "$LABEL" --force --color B60205 \
                --description 'A search engine adapter fails on the live site'
              gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md
            fi
          elif [ "$COMPLETE" = true ] && [ -n "$number" ]; then
            gh issue close "$number" --comment "Every site passes again: $RUN_URL (\`$REF\` at $COMMIT)"
          else
            echo 'Nothing to do'
          fi
