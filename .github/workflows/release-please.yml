name: Release Please

# Keeps a release PR up to date from conventional commits. Merging that PR
# bumps package.json, updates CHANGELOG.md, tags vX.Y.Z and creates the GitHub
# release, then this workflow calls publish.yml to ship the stores.
#
# Tags/releases made with the default GITHUB_TOKEN do not trigger other
# workflows (so publish.yml's `push: tags` never fires for them); that is why
# publish.yml is called here instead of relying on the tag.
#
# Config: release-please-config.json, .release-please-manifest.json.
# Releases are cut from `main`: work lands on `wxt`, and a release starts when
# `wxt` is merged into `main`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR branch is pushed with GITHUB_TOKEN, so its push and
      # pull_request runs never start (or wait for approval). workflow_dispatch
      # is exempt: its runs use the branch's head commit, so they show up as
      # the PR's checks. `pr` is only set when the PR was created or updated.
      - name: Run checks on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.release.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Parsed in the shell: fromJSON in env failed this step on the empty
          # output of a failed release-please run, even with the `if` false.
          PR: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(jq -r .headBranchName <<<"$PR")
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run integration.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
    secrets: inherit
